<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games | Ony-Labs</title>
<meta name="description" content="Browser-Games von Ony-Labs. Direkt spielen, ohne Download.">
<style>
:root{color-scheme:dark;--bg:#07030b;--ink:#f8f3ea;--muted:#c3b9cf;--quiet:#867893;--gold:#ffd86b;--violet:#7d5cff;--line:rgba(255,216,107,.16);--panel:rgba(255,255,255,.052)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Segoe UI Variable","Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
background:radial-gradient(circle at 10% 8%,rgba(255,216,107,.14),transparent 34rem),radial-gradient(circle at 78% 4%,rgba(125,92,255,.22),transparent 42rem),linear-gradient(180deg,#07030b,#100718 60%,#08040d)}
a{color:inherit;text-decoration:none}
.shell{width:min(1100px,100% - 40px);margin-inline:auto}
nav{padding:22px 0}
nav .shell{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:760;letter-spacing:.18em;text-transform:uppercase;font-size:13px}
.back{color:var(--muted);font-size:14px}.back:hover{color:var(--gold)}
header.hero{padding:56px 0 36px}
.micro{color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:12px}
h1{font-size:clamp(2.2rem,6vw,4rem);margin:.3em 0 .2em;line-height:1.05}
.lead{color:var(--muted);max-width:52ch;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:12px 0 80px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:transform .35s cubic-bezier(.16,1,.3,1),border-color .35s}
.card:hover{transform:translateY(-4px);border-color:rgba(255,216,107,.45)}
.thumb{aspect-ratio:16/10;display:grid;place-items:center;font-size:2.4rem;font-weight:800;letter-spacing:.08em;background:linear-gradient(135deg,#2a1450,#0d0913);background-size:cover;background-position:center}
.body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{margin:0;font-size:1.25rem}
.body p{margin:0;color:var(--muted);font-size:.95rem;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--line-v,rgba(125,92,255,.4));color:var(--quiet)}
.play{margin-top:8px;align-self:flex-start;padding:10px 20px;border-radius:99px;background:linear-gradient(90deg,var(--gold),#edae45);color:#1a0f00;font-weight:700;font-size:14px}
.play.soon{background:transparent;border:1px solid var(--line);color:var(--quiet);pointer-events:none}
footer{padding:30px 0 50px;color:var(--quiet);font-size:13px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<nav><div class="shell"><a class="brand" href="../">Ony-Labs</a><a class="back" href="../">← Zur Startseite</a></div></nav>
<header class="hero shell">
  <span class="micro">Ony-Labs Arcade</span>
  <h1>Games</h1>
  <p class="lead">Browser-Games aus dem Lab. Direkt spielen, ohne Download, am Handy und am PC.</p>
</header>
<main class="shell"><div class="grid" id="grid"></div></main>
<footer><div class="shell">© Ony-Labs · Spiele sind Experimente und ändern sich laufend.</div></footer>
<script>
/* Neues Game hinzufügen: Eintrag ergänzen und Ordner games/<slug>/ mit index.html anlegen. */
const GAMES=[
 {slug:"monsterbonk",title:"MONSTERBONK",desc:"Browser-Survival: Monster sammeln, überleben, stärker werden.",tags:["Survival","Roguelite"],thumb:"",live:false},
 {slug:"aschenpfad",title:"ASCHENPFAD",desc:"Pixelart-Roguelike-Metroidvania im Browser.",tags:["Roguelike","Metroidvania","Handy + PC"],thumb:"",live:true}
];
const g=document.getElementById("grid");
g.innerHTML=GAMES.map(x=>`<a class="card" href="${x.live?x.slug+'/':'#'}" ${x.live?'':'aria-disabled="true"'}>
<div class="thumb" style="${x.thumb?`background-image:url(${x.thumb})`:''}">${x.thumb?'':x.title.slice(0,2)}</div>
<div class="body"><h2>${x.title}</h2><p>${x.desc}</p>
<div class="tags">${x.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
<span class="play ${x.live?'':'soon'}">${x.live?'Spielen':'Bald verfügbar'}</span></div></a>`).join("");
</script>
</body>
</html>
