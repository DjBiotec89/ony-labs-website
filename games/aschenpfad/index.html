function M(){const b=G.best||(G.best={});if(!b.up)b.up={};if(!b.found)b.found=[];if(!b.bb)b.bb=[];b.ash=b.ash||0;b.tk=b.tk||0;b.tier=b.tier||0;b.sec=b.sec||0;return b}
function upl(id){return M().up[id]||0}
function unlocked(i){const b=M();return i<3||(i===3&&b.bb.indexOf(2)>=0)||(i===4&&b.tk>=300)||(i===5&&(b.wins||0)>=1)}
function applyMeta(s){s.dmg*=1+.06*upl('dmg');s.gold+=.15*upl('gold');s.essRate*=1+.2*upl('morph');s.dashCd*=1-.08*upl('dash');s.luck=upl('luck')}
function initRunMeta(p){p.maxhp+=10*upl('hp');p.hp=p.maxhp;p.flaskMax=p.flask=1+upl('flask')+(p.cls===5?1:0);p.revives=upl('revive');p.weapons[0].lvl=upl('wpn');G.runBoss=0;G.runSec=0;G.voidF=false;G.unlB=[3,4,5].map(unlocked);if(upl('relic'))after(1.5,openChoice)}
function metaEnd(win){const b=M();b.runs=(b.runs||0)+1;b.tk+=G.kills;b.kills=Math.max(b.kills||0,G.kills);G.unl=[];G.voidF=false;
  if(win){b.wins=(b.wins||0)+1;if(!b.best||G.runTime<b.best)b.best=G.runTime;if(G.tier>=b.tier&&b.tier<5){b.tier++;G.unl.push('NEUE ASCHE-STUFE '+b.tier+': HÄRTER, ABER MEHR ASCHE')}}
  G.ashGain=Math.round((G.kills*.5+G.runBoss*15+G.runSec*5+G.bi*10+(win?60:0))*(1+.3*G.tier));b.ash+=G.ashGain;
  [3,4,5].forEach((c,i)=>{if(!G.unlB[i]&&unlocked(c))G.unl.push('NEUER CHARAKTER: '+CLASSES[c].name)});saveMeta()}
function drink(p){if(p.dead)return;if(p.flask<=0){floatText(p.x+4,p.y-8,'FLASCHE LEER','#9a9aa8');return}if(p.hp>=p.maxhp)return;p.flask--;heal(p.maxhp*.35);sfx('pick');burst(p.x+4,p.y+6,14,[.5,1,.5],110,true);ring(p.x+4,p.y+6,18,[.5,1,.5],.3)}
function buyUp(i){const b=M(),u=UPG[i],l=upl(u.id),cost=u.cost*(l+1);if(l>=u.max||b.ash<cost){sfx('hurt');return}b.ash-=cost;b.up[u.id]=l+1;saveMeta();sfx('pick')}
